[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gmat-mcp"
version = "0.4.0rc1"
description = "Isolated, interactive MCP sessions for NASA GMAT and GMAT-Qt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp>=2,<3", "pydantic>=2.12,<3", "platformdirs>=4,<5", "matplotlib>=3.9,<4", "scipy>=1.15,<2", "pywin32>=312,<313; sys_platform == 'win32'"]

[project.scripts]
gmat-mcp = "gmat_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["native: requires configured local GMAT installations"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/examples", "/integrations", "/missions/*.script", "/.github", "/README.md", "/VALIDATION.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
